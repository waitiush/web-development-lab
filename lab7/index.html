<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лаб 7 — SCSS Refactor: Зургийн цомог портал</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header__navbar">
      <a href="#" class="site-header__logo">
        <svg class="site-header__logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/>
          <circle cx="9" cy="9" r="2" fill="currentColor"/>
          <path d="M21 15l-5-5-11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        T<span>Студио</span>
      </a>

      <nav aria-label="Үндсэн цэс">
        <ul class="site-header__nav-list">
          <li><a class="site-header__nav-link" href="#gallery">Цомог</a></li>
          <li><a class="site-header__nav-link" href="#video">Видео</a></li>
          <li><a class="site-header__nav-link" href="#map">Байршил</a></li>
        </ul>
      </nav>

      <button id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Харанхуй горим солих">
        <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
          <path stroke="currentColor" stroke-width="2" stroke-linecap="round"
            d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero__title">Манай зургийн цомог</h1>
      <p class="hero__text">Карт бүр дээр хулганаа аваачих эсвэл Tab товчоор очоод Enter дарж 3D flip эффектийг үзээрэй.</p>
    </section>

    <section class="gallery" id="gallery" aria-label="Зургийн цомог">
      <h2 class="section-title">Галерей</h2>

      <div class="gallery__grid">

        <div class="flip-card" style="--i:0">
          <button class="flip-card__trigger" aria-label="Зураг 1-ийг эргүүлэх">
            <div class="flip-card__inner">
              <div class="flip-card__front">
                <img class="flip-card__img" src="img/photo1.jpg" alt="Байгалийн үзэсгэлэнт газрын зураг 1" loading="lazy">
              </div>
              <div class="flip-card__back">
                <h3 class="flip-card__title">Уулын өглөө</h3>
                <p class="flip-card__text">Эрт өглөөний манан хөвсөн уулс.</p>
              </div>
            </div>
          </button>
        </div>

        <div class="flip-card" style="--i:1">
          <button class="flip-card__trigger" aria-label="Зураг 2-ыг эргүүлэх">
            <div class="flip-card__inner">
              <div class="flip-card__front">
                <img class="flip-card__img" src="img/photo2.jpg" alt="Нуурын эрэг дээрх зураг" loading="lazy">
              </div>
              <div class="flip-card__back">
                <h3 class="flip-card__title">Тунгалаг нуур</h3>
                <p class="flip-card__text">Намрын тунгалаг цэнгэг нуур.</p>
              </div>
            </div>
          </button>
        </div>

        <div class="flip-card" style="--i:2">
          <button class="flip-card__trigger" aria-label="Зураг 3-ыг эргүүлэх">
            <div class="flip-card__inner">
              <div class="flip-card__front">
                <img class="flip-card__img" src="img/photo3.jpg" alt="Ойн зам" loading="lazy">
              </div>
              <div class="flip-card__back">
                <h3 class="flip-card__title">Нарт ойн зам</h3>
                <p class="flip-card__text">Явган зам дагуу гэрэлтсэн навчис.</p>
              </div>
            </div>
          </button>
        </div>

        <div class="flip-card" style="--i:3">
          <button class="flip-card__trigger" aria-label="Зураг 4-ийг эргүүлэх">
            <div class="flip-card__inner">
              <div class="flip-card__front">
                <img class="flip-card__img" src="img/photo4.jpg" alt="Цөлийн ландшафт" loading="lazy">
              </div>
              <div class="flip-card__back">
                <h3 class="flip-card__title">Элсэн манхан</h3>
                <p class="flip-card__text">Орой бүрийн алтан өнгийн манхад.</p>
              </div>
            </div>
          </button>
        </div>

        <div class="flip-card" style="--i:4">
          <button class="flip-card__trigger" aria-label="Зураг 5-ыг эргүүлэх">
            <div class="flip-card__inner">
              <div class="flip-card__front">
                <img class="flip-card__img" src="img/photo5.jpg" alt="Хотын шөнийн гэрэл" loading="lazy">
              </div>
              <div class="flip-card__back">
                <h3 class="flip-card__title">Хотын шөнө</h3>
                <p class="flip-card__text">Гэрэлт үерхэж буй хотын харанхуй.</p>
              </div>
            </div>
          </button>
        </div>

        <div class="flip-card" style="--i:5">
          <button class="flip-card__trigger" aria-label="Зураг 6-ыг эргүүлэх">
            <div class="flip-card__inner">
              <div class="flip-card__front">
                <img class="flip-card__img" src="img/photo6.jpg" alt="Далайн эрэг" loading="lazy">
              </div>
              <div class="flip-card__back">
                <h3 class="flip-card__title">Далайн эрэг</h3>
                <p class="flip-card__text">Давалгаа үргэлж эрэг рүү тогтмол ирнэ.</p>
              </div>
            </div>
          </button>
        </div>

      </div>
    </section>

    <section class="media-section" id="video" aria-label="Видео">
      <h2 class="section-title">Цомгийн видео</h2>
      <video controls preload="metadata" poster="img/photo1.jpg" class="media-section__video">
        <source src="video/clip.mp4" type="video/mp4">
        <source src="video/clip.webm" type="video/webm">
        <track kind="captions" src="video/clip.mn.vtt" srclang="mn" label="Монгол хадмал" default>
        Таны браузер видео тоглуулахыг дэмжихгүй байна.
      </video>
    </section>

    <section class="media-section" id="map" aria-label="Байршил">
      <h2 class="section-title">Байршил</h2>
      <div class="media-section__iframe-wrap">
        <iframe
          src="https://www.google.com/maps?q=47.9206526,106.9662756&z=16&output=embed"
          title="School of Information and Telecommunication Technology-ийн байршил"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 TСтудио. Бүх эрх хуулиар хамгаалагдсан.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
